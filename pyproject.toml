[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-compute-lab"
version = "0.3.0"
description = "Verified Compute Lab (Workbench v3): procedural tool-use tasks across eight domains for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    # OpenEnv at the revision pinned by OpenEnv Arena
    "openenv @ git+https://github.com/meta-pytorch/OpenEnv.git@86a180ede21e044f7929b9a7783ad83aa67d83a3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
server = "compute_lab.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["compute_lab", "compute_lab.server", "compute_lab.server.tasks", "compute_lab.server.workbench"]
package-dir = { "compute_lab" = ".", "compute_lab.server" = "server", "compute_lab.server.tasks" = "server/tasks", "compute_lab.server.workbench" = "server/workbench" }
